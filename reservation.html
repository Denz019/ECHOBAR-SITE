<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reservationstyle.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body class="resi_site">
    <header>

    </header>


    <main>
        <section class="reservation">

            <!-- <div>
                <img src="imgs-echo/reservation.webp" alt="resivation">
            </div> -->

            <div class="reservation-text">
                <div class="h1">
                    <h1>RESERVATION</h1>
                </div>
                <div class="h2">
                    <h2>Book your table here</h2>
                </div>
            </div>
        </section>



        <form id="webform">
            <div class="input-info">
                <legend>
                    <h3>Complete Your Reservation</h3>
                </legend>

                <div class="fullName">
                    <label for="Fullname">Name and Lastname</label>
                    <input class="input" required type="text" id="Fullname" name="Full_name">
                </div>


                <div class="PhoneN">
                    <label for="phoneN">Phone number</label>
                    <input class="input" required type="tel" id="phoneN" name="phone_number">
                </div>

                <div class="eMail">
                    <div>
                        <label for="email">E-mail</label>
                    </div>
                    <div>
                        <input class="input" required type="email" id="email" name="e_mail">
                    </div>
                </div>



                <div class="buttonWrapper">
                    <button type="submit" class="submit">Confirm reservation</button>
                </div>
            </div>

            </div>
        </form>



        <div class="map">
            <h3 class="text_map">Visit ECHO</h3>
            <div class="MAP_map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d17994.910474864228!2d12.550144!3d55.6826624!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x46525375cafd3fad%3A0x9d0a5782c1303810!2sEcho%20Bar!5e0!3m2!1sen!2sdk!4v1779228683910!5m2!1sen!2sdk"
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </main>

    <footer>
        <br>
        <br>
        <br>
    </footer>
    <script src="reservation.js"></script>
</body>

</html>
